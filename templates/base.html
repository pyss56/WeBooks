<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}后台管理{% endblock %} - {{ app_name }}</title>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css" onerror="this.remove()">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            min-height: 100vh;
            padding: 20px 0;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: width 0.25s ease;
        }
        .sidebar.collapsed { width: 60px; }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 8px;
        }
        .sidebar-title {
            font-size: 18px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
        .sidebar-toggle {
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #888;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .sidebar-toggle:hover { background: #f0f0f0; }
        .sidebar.collapsed .sidebar-toggle { margin: 0 auto; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-menu li a:hover {
            background: #f0f7ff;
            color: #1a73e8;
        }
        .sidebar-menu li a.active {
            background: #e8f0fe;
            color: #1a73e8;
            font-weight: 600;
            border-right: 3px solid #1a73e8;
        }
        .sidebar-menu li a .icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .sidebar-menu li a .label {
            transition: opacity 0.2s;
        }
        .sidebar.collapsed .sidebar-menu li a .label { opacity: 0; width: 0; overflow: hidden; }
        .sidebar.collapsed .sidebar-menu li a { padding: 12px 20px; justify-content: center; }
        .sidebar.collapsed .sidebar-menu li a.active { border-right: none; }
        .sidebar { display: flex; flex-direction: column; }
        .sidebar-inner { flex: 1; }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #bbb;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .sidebar.collapsed .sidebar-footer { opacity: 0; }
        .main-content {
            flex: 1;
            padding: 40px;
            min-width: 0;
            width: 100%;
        }
        .sidebar.collapsed + .main-content { max-width: none; }
        .main-content h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 8px;
        }
        .main-content .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .toast.success { background: #07c160; }
        .toast.error { background: #e4393c; }
        .toast.show { display: block; animation: fadeIn .3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .btn { padding: 8px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #07c160; color: #fff; }
        .btn-primary:hover { background: #06ad56; }
        .btn-primary:disabled { background: #94dbb0; cursor: not-allowed; }
        .btn-outline { background: #fff; color: #333; border: 1px solid #d9d9d9 !important; }
        .btn-outline:hover { border-color: #07c160 !important; color: #07c160; }
        .btn-danger { background: #e4393c; color: #fff; }
        .btn-danger:hover { background: #d03033; }
        .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 3px; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .error-msg { color: #c62828; background: #fce4ec; padding: 12px 16px; border-radius: 8px; }
        .refresh-btn {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            color: #555;
        }
        .refresh-btn:hover { background: #f5f5f5; }
        /* ── 通用模态框 ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; border-radius: 8px; padding: 24px; width: 800px; max-width: 90vw;
            box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 80vh; overflow-y: auto;
        }
        .modal h3 { font-size: 16px; margin-bottom: 16px; }
        .modal .field { margin-bottom: 14px; }
        .modal .field label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .modal .field input, .modal .field select, .modal .field textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9;
            border-radius: 4px; font-size: 14px; outline: none; font-family: inherit;
        }
        .modal .field input:focus, .modal .field select:focus, .modal .field textarea:focus { border-color: #07c160; }
        .modal .field textarea { resize: vertical; min-height: 60px; }
        .modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        /* ── 通用图标/颜色选择器 ── */
        .icon-grid {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 4px;
            max-height: 160px; overflow-y: auto;
        }
        .icon-grid .icon-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 6px 2px; border: 2px solid #eee; border-radius: 8px; cursor: pointer;
            transition: all 0.15s; background: #fff;
        }
        .icon-grid .icon-item:hover { border-color: #07c160; background: #f6ffed; }
        .icon-grid .icon-item.selected { border-color: #07c160; background: #e8f5e9; }
        .icon-grid .icon-item .icon-preview { font-size: 18px; color: #555; line-height: 1; }
        .icon-grid .icon-item .icon-label { font-size: 9px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; max-width: 100%; }
        .color-grid {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;
        }
        .color-grid .color-item {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.15s; position: relative;
        }
        .color-grid .color-item:hover { transform: scale(1.15); }
        .color-grid .color-item.selected { border-color: #333; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #333; }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
        .empty-msg { text-align: center; padding: 40px; color: #999; font-size: 14px; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">⚙️ 后台管理</div>
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="折叠菜单">◀</button>
        </div>
        <div class="sidebar-inner">
        <ul class="sidebar-menu">
            <li><a href="/" class="{% block nav_home %}{% endblock %}"><span class="icon">🏠</span><span class="label">首页</span></a></li>
            <li><a href="/categories" class="{% block nav_category %}{% endblock %}"><span class="icon">📂</span><span class="label">科目管理</span></a></li>
            <li><a href="/budgets" class="{% block nav_budget %}{% endblock %}"><span class="icon">📊</span><span class="label">预算管理</span></a></li>
            <li><a href="/accounts" class="{% block nav_account %}{% endblock %}"><span class="icon">👤</span><span class="label">账户设置</span></a></li>
            
            <li><a href="/transaction" class="{% block nav_bills %}{% endblock %}"><span class="icon">💰</span><span class="label">交易查询</span></a></li>
            <li><a href="/reconciliation" class="{% block nav_reconciliation %}{% endblock %}"><span class="icon">✅</span><span class="label">对账管理</span></a></li>
            
            <li><a href="/message-log" class="{% block nav_message_log %}{% endblock %}"><span class="icon">📋</span><span class="label">消息日志</span></a></li>

            <li><a href="/user" class="{% block nav_users %}{% endblock %}"><span class="icon">👥</span><span class="label">用户管理</span></a></li>
            <li><a href="/scheduled-tasks" class="{% block nav_scheduler %}{% endblock %}"><span class="icon">⏰</span><span class="label">计划任务</span></a></li>
        </ul>
        </div>
        <div class="sidebar-footer">
            <div style="margin-bottom:6px;">WeBooks v{{ version }}</div>
            <hr style="border:none;border-top:1px solid #eee;margin:6px 0;">
            <div><a href="/logout" style="font-size:12px;color:#999;text-decoration:none;">🚪 退出登录</a></div>
        </div>
    </div>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            const btn = sidebar.querySelector('.sidebar-toggle');
            btn.textContent = isCollapsed ? '▶' : '◀';
            try { localStorage.setItem('sidebar_collapsed', isCollapsed ? '1' : '0'); } catch(e) {}
        }
        (function() {
            try {
                if (localStorage.getItem('sidebar_collapsed') === '1') {
                    document.getElementById('sidebar').classList.add('collapsed');
                    document.querySelector('.sidebar-toggle').textContent = '▶';
                }
            } catch(e) {}
        })();
        {% block extra_script %}{% endblock %}
    </script>
</body>
</html>
